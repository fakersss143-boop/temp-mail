<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temp Mail — Ultra-Reliable</title>
<style>
  :root {
    --bg: #080c18;
    --panel: #0e1424;
    --panel-2: #121a2e;
    --border: #202a44;
    --text: #e7ebf5;
    --text-dim: #8891a8;
    --accent: #5b8cff;
    --accent-dim: #2a3a63;
    --good: #37d67a;
    --warn: #ffcc00;
    --error: #ff4b4b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .brand span { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); transition: 0.3s; }
  .dot.online { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.offline { background: var(--error); box-shadow: 0 0 8px var(--error); }

  .address-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .address-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .address-row { display: flex; gap: 8px; align-items: center; }
  .address-field {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 15px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis;
  }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 12px 16px; font-size: 13px; font-weight: 600; transition: 0.15s; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

  .inbox-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; min-height: 200px; }
  .inbox-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  
  .watching { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .spinner { width: 10px; height: 10px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { padding: 48px 24px; text-align: center; color: var(--text-dim); font-size: 14px; }
  .error-tip { font-size: 12px; color: var(--warn); margin-top: 10px; display: none; }

  .mail-item { padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .mail-item:hover { background: var(--panel-2); }
  .mail-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .mail-from { font-weight: 600; color: var(--text); font-size: 14px; }
  .mail-subject { font-size: 13px; color: var(--text-dim); }

  .reader { padding: 20px; }
  .reader-back { color: var(--accent); background: none; margin-bottom: 15px; padding: 0; }
  iframe { width: 100%; border: none; background: white; border-radius: 8px; min-height: 400px; margin-top: 15px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">Temp<span>Mail</span> Pro</div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </header>

  <div class="address-card">
    <div class="address-label">Your Private Inbox</div>
    <div class="address-row">
      <div class="address-field" id="addressField">Initialising...</div>
      <button class="btn-ghost" id="copyBtn">Copy</button>
      <button class="btn-primary" id="newBtn">New</button>
    </div>
  </div>

  <div class="inbox-card">
    <div class="inbox-header">
      Inbox
      <span class="watching" id="syncStatus">
        <span class="spinner"></span> Syncing...
      </span>
    </div>
    <div id="inboxBody">
      <div class="empty-state" id="mainLoader">
        Waiting for mail...
        <div class="error-tip" id="troubleshoot">
          Hint: If it stays "Initialising", try turning off AdBlockers.
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
const API = "https://api.mail.gw";
let token = localStorage.getItem('tm_token') || "";
let account = JSON.parse(localStorage.getItem('tm_acc')) || null;
let messages = [];

// Elements
const addressField = document.getElementById('addressField');
const inboxBody = document.getElementById('inboxBody');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const troubleshoot = document.getElementById('troubleshoot');

async function call(path, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    
    const resp = await fetch(API + path, { ...options, headers });
    if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.message || 'API Error');
    }
    return resp.status === 204 ? null : resp.json();
}

async function init() {
    try {
        updateStatus("connecting", "Finding Domain...");
        
        // If we have a stored account, try to login
        if (account && token) {
            addressField.textContent = account.address;
            updateStatus("online", "Online");
            startPolling();
            return;
        }

        // 1. Get Domains
        const domains = await call('/domains');
        const domain = domains['hydra:member'][0].domain;

        // 2. Create User
        const user = Math.random().toString(36).substring(2, 12);
        const email = `${user}@${domain}`;
        const pass = 'pass' + Math.random().toString(36).substring(2, 8);

        updateStatus("connecting", "Securing Inbox...");
        await call('/accounts', {
            method: 'POST',
            body: JSON.stringify({ address: email, password: pass })
        });

        // 3. Login
        const auth = await call('/token', {
            method: 'POST',
            body: JSON.stringify({ address: email, password: pass })
        });

        token = auth.token;
        account = { address: email };
        localStorage.setItem('tm_token', token);
        localStorage.setItem('tm_acc', JSON.stringify(account));
        
        addressField.textContent = email;
        updateStatus("online", "Online");
        startPolling();

    } catch (e) {
        console.error(e);
        updateStatus("offline", "Failed to Connect");
        addressField.textContent = "Connection Error";
        troubleshoot.style.display = "block";
    }
}

async function checkMail() {
    if (!token) return;
    try {
        const data = await call('/messages');
        const newMsgs = data['hydra:member'];
        
        if (JSON.stringify(newMsgs) !== JSON.stringify(messages)) {
            messages = newMsgs;
            renderList();
        }
        document.getElementById('syncStatus').innerHTML = `<span class="spinner"></span> Watching for mail...`;
    } catch (e) {
        document.getElementById('syncStatus').innerHTML = `⚠️ Sync Paused`;
    }
}

function renderList() {
    if (messages.length === 0) {
        inboxBody.innerHTML = `<div class="empty-state">No emails yet.</div>`;
        return;
    }
    inboxBody.innerHTML = messages.map(m => `
        <div class="mail-item" onclick="viewMail('${m.id}')">
            <div class="mail-top">
                <span class="mail-from">${m.from.address}</span>
                <span class="mail-time">Just now</span>
            </div>
            <div class="mail-subject">${m.subject || '(No Subject)'}</div>
        </div>
    `).join('');
}

async function viewMail(id) {
    inboxBody.innerHTML = `<div class="empty-state">Loading content...</div>`;
    try {
        const mail = await call(`/messages/${id}`);
        inboxBody.innerHTML = `
            <div class="reader">
                <button class="reader-back" onclick="renderList()">← Back to Inbox</button>
                <div class="reader-subject">${mail.subject}</div>
                <div class="reader-body">
                    <strong>From:</strong> ${mail.from.address}<br>
                    <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
                    ${mail.html ? `<iframe srcdoc="${mail.html[0].replace(/"/g, '&quot;')}"></iframe>` : mail.text}
                </div>
            </div>`;
    } catch (e) {
        renderList();
        alert("Error loading message.");
    }
}

function updateStatus(type, text) {
    statusText.textContent = text;
    statusDot.className = "dot " + (type === "online" ? "online" : type === "offline" ? "offline" : "");
}

function startPolling() {
    checkMail();
    setInterval(checkMail, 5000);
}

document.getElementById('newBtn').addEventListener('click', () => {
    localStorage.clear();
    location.reload();
});

document.getElementById('copyBtn').addEventListener('click', () => {
    const email = addressField.textContent;
    if (email.includes('@')) {
        navigator.clipboard.writeText(email);
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }
});

init();
</script>
</body>
</html>
